<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>VBT Pro Prototype</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body class="theme-deadlift">
  <div class="app-container">
    
    <!-- Header -->
    <header>
      <div class="branding">VBT <span>PRO_</span></div>
      <div id="status-badge" class="badge disconnected">Disconnected</div>
    </header>

    <!-- Controls -->
    <section class="controls-section">
      <button id="btn-connect" class="btn-primary">
        <span class="btn-text">Connect Sensor</span>
        <div class="btn-glow"></div>
      </button>
      
      <div class="lift-selector">
        <select id="lift-select">
          <option value="Deadlift">DEADLIFT</option>
          <option value="Squat">SQUAT</option>
          <option value="Bench">BENCH</option>
        </select>
        <div class="selector-highlight"></div>
      </div>
    </section>

    <!-- Visualizer & Live Data -->
    <section class="visualizer-section">
      <div class="metric-panel left">
        <div class="metric-label">VELOCITY</div>
        <div class="metric-value"><span id="live-velocity">0.00</span></div>
        <div class="metric-unit">m/s</div>
      </div>
      
      <div class="bar-path-container">
        <div class="track"></div>
        <div id="orb" class="orb"></div>
      </div>

      <div class="metric-panel right">
        <div class="metric-label">EST RPE</div>
        <div class="metric-value"><span id="live-rpe">0.0</span></div>
        <div class="metric-unit">/ 10</div>
      </div>
    </section>

    <!-- Session History -->
    <section class="history-section">
      <div class="history-header">Session History</div>
      <div class="history-list" id="history-list">
        <!-- JS inserts rows here -->
        <div class="empty-state">No reps recorded yet.</div>
      </div>
    </section>

  </div>
  <script src="app.js"></script>
</body>
</html>
