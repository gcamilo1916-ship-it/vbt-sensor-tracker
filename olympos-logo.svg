<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 140" width="100%" height="140">
  <defs>
    <linearGradient id="olymposGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="65%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>
    <linearGradient id="erosAccentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#E6EDF5" />
      <stop offset="100%" stop-color="#70F0FF" />
    </linearGradient>
    <linearGradient id="subGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#71717A" />
      <stop offset="100%" stop-color="#A1A1AA" />
    </linearGradient>
  </defs>
  <rect width="780" height="140" fill="transparent" />
  
  <!-- Olympos Arrow Insignia -->
  <g transform="translate(100, 16) scale(0.11)" stroke="#FFFFFF" fill="none">
    <line x1="500" y1="90" x2="500" y2="910" stroke-width="18" stroke="#FFFFFF" />
    <polygon points="500,50 460,150 500,130 540,150" fill="#FFFFFF" stroke="none" />
    <path d="M 100,370 Q 500,200 900,370" stroke-width="16" stroke-linecap="round" />
    <path d="M 140,480 Q 500,300 860,480" stroke-width="16" stroke-linecap="round" />
    <path d="M 190,590 Q 500,410 810,590" stroke-width="16" stroke-linecap="round" />
    <path d="M 250,700 Q 500,520 750,700" stroke-width="16" stroke-linecap="round" />
    <polyline points="400,780 440,730 500,620" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />
    <polyline points="600,780 560,730 500,620" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />
    <polyline points="440,840 500,720 560,840" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Olympos Technologies Wordmark in Mercury Font (Mixed Title Case) -->
  <text x="245" y="66" font-family="'Mercury', 'Mercury Text G1', 'Mercury Display', 'Mercury Text', Georgia, 'Times New Roman', serif" font-size="36" font-weight="700" letter-spacing="-0.01em" fill="url(#olymposGradient)">
    Olympos Technologies
  </text>
  
  <!-- Sub-label with Eros Sensor Mission Branding -->
  <text x="247" y="98" font-family="'Helvetica Neue', Helvetica, Arial, -apple-system, sans-serif" font-size="18" font-weight="600" letter-spacing="0.12em" fill="url(#erosAccentGrad)">
    EROS SENSOR MISSION <tspan font-size="12" font-weight="500" letter-spacing="0.22em" fill="url(#subGradient)">• VELOCITY BASED TRAINING</tspan>
  </text>
</svg>
